name: CI

# The required status check for this repo is the "CI Status" job (see the
# "before-push-main" ruleset). That is why this workflow must NOT use
# paths/paths-ignore filters on `on:`: a workflow that never triggers also
# never reports its check, leaving the PR stuck on
# "Expected - waiting for status to be reported" forever.
#
# Instead each job decides for itself whether it needs to run, and
# "CI Status" aggregates the results at the end.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # "every": a file only counts as code when it is neither under
          # docs/ nor a Markdown file.
          filters: |
            code:
              - predicate-quantifier: 'every'
              - '!docs/**'
              - '!**/*.md'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/ci.yml'

  build:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Always build on main; on PRs only when actual code changed.
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint:ci

      - name: Types
        run: bun run typecheck

      - name: Build
        run: bun run build

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.docs == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build, docs]
    # Must ALWAYS run, otherwise the required check never reports back.
    if: always()
    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.docs.result }}
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "build:   ${{ needs.build.result }}"
          echo "docs:    ${{ needs.docs.result }}"
          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::CI failed"
            exit 1
          fi
          echo "CI passed"
