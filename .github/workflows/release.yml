name: Release Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets you (re)build the image for a tag that already exists, e.g. when a
  # tag was created by hand and never triggered the push event.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.5.0'
        required: true
        type: string

jobs:
  push_to_registries:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker tags
        id: meta
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          clean_tag="${VERSION_TAG#v}"
          tags="ghcr.io/${OWNER}/waffle:${clean_tag}"

          # Only plain releases move :latest and the major alias; pre-release
          # tags such as v1.2.3-rc.1 publish under their exact version only.
          if [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags},ghcr.io/${OWNER}/waffle:latest"
            tags="${tags},ghcr.io/${OWNER}/waffle:${clean_tag%%.*}"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
